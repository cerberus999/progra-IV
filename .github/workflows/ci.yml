name: CI - Build & Test Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./motorikes/HolaMundo
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./motorikes/HolaMundo/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend (producción)
        run: npm run build --prod

      - name: Ejecutar tests
        run: npm test
